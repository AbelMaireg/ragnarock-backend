services:
  sdlc-ai:
    build: .
    container_name: sdlc-ai-service
    ports:
      # Exposed locally for development. In production, remove this and let
      # NestJS reach the service by its internal Docker network name.
      - "8100:8100"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
