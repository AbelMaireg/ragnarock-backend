services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20

  pgvector-memory:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_secret
      POSTGRES_DB: ai_memory
    ports:
      - "5433:5432"
    volumes:
      - pgvector_memory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_memory"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.1
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    env_file:
      - ../.env
    # Official image has no curl/wget; use bash /dev/tcp to verify the HTTP port is listening.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 3s bash -c 'echo > /dev/tcp/127.0.0.1/8108' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest

  # nginx:
