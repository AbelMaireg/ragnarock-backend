name: ragnarock

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg17
    env_file: ../../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.1
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    env_file: ../../.env
    healthcheck:
      test: ["CMD-SHELL", "timeout 3s bash -c 'echo > /dev/tcp/127.0.0.1/8108' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Python AI Agent ───────────────────────────────────────────────────────────

  sdlc-ai:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile
    env_file: ../../agent/.env
    environment:
      # Override localhost defaults from agent/.env with Docker service names
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT:-5432}/${DB_NAME}
      APP_ENV: staging
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── NestJS Main API ───────────────────────────────────────────────────────────

  backend:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile
    env_file: ../../.env
    environment:
      NODE_ENV: staging
      # Override localhost defaults from .env with Docker service names
      REDIS_HOST: redis
      AI_AGENT_BASE_URL: http://sdlc-ai:8100
    ports:
      - "8000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      sdlc-ai:
        condition: service_healthy
    restart: unless-stopped

  # ── NestJS Admin API ──────────────────────────────────────────────────────────

  admin:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile
    env_file: ../../.env
    environment:
      NODE_ENV: staging
      APP: admin
      # Override localhost defaults from .env with Docker service names
      REDIS_HOST: redis
    ports:
      - "8001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  typesense_data:
