name: ragnarock

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: ../../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.1
    env_file: ../../.env
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 3s bash -c 'echo > /dev/tcp/127.0.0.1/8108' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  agent:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile.agent
    env_file: ../../agent/.env
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  main:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile.main
    env_file: ../../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      mailpit:
        condition: service_started
      agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile.admin
    env_file: ../../.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      main:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  typesense_data:
